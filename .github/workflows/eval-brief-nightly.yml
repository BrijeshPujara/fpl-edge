name: Brief eval (judged)

# The paid half of the brief eval.
#
# The CI job grades briefs that were recorded earlier, which makes it free and
# fast but also blind in one specific way: a recording cannot drift. It says
# nothing about what the model would write TODAY, and a provider's silent point
# release is exactly the kind of change that shows up as prose quality long
# before it shows up anywhere else.
#
# So this regenerates the whole corpus against the live API and judges it. It
# runs nightly rather than per-push because it costs money, and money is what
# turns a gate into something people switch off.
#
# It commits the fresh recordings back, which is what lets the free CI job stay
# meaningful: tomorrow's push is graded against yesterday's real output.

on:
  schedule:
    # 03:00 UTC. Off the hour of every FPL sync, so a slow eval cannot delay
    # the data collection that actually cannot be backfilled.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: eval-brief
  cancel-in-progress: false

jobs:
  # Does the key exist?
  #
  # Only so the job below can be SKIPPED rather than pass. The first version
  # checked inside the step and exited zero, which meant a workflow that had
  # never once run showed a green tick every morning — the exact failure this
  # repo keeps finding elsewhere, a gate that looks like coverage and is not.
  # Written here two days before it was noticed.
  #
  # A skipped job is grey in the UI and legibly different from a passing one.
  # Failing instead would be wrong: a missing key is a configuration state, not
  # a broken build, and red for configuration is what teaches people to ignore
  # red.
  #
  # The job-level `if` cannot read `secrets`, which is why this exists as a
  # separate job at all rather than a condition.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY is not set; the brief eval cannot run."
          fi

  judged:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # No guard here any more. `preflight` decided, and this job does not run
      # at all without a key — so a failure below is a real one.
      - name: Generate, record and judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval:brief -- --live --samples=3 --judge

      # Recordings are committed even when the eval fails, and deliberately so.
      # A failing run is the one whose output someone needs to read.
      - name: Commit refreshed recordings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evals/brief/recorded
          git diff --staged --quiet || git commit -m "chore: refresh brief eval recordings"
          git push
