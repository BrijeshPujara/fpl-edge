name: Sync FPL data

# Why GitHub Actions rather than Vercel Cron:
#   - Vercel Hobby has historically capped cron at two jobs, daily granularity
#     only. PLAN.md section 9 needs four schedules plus in-play polling.
#   - Nothing is deployed yet, so there is no URL for a cron to call — and the
#     per-gameweek and price history this project is built on CANNOT be
#     backfilled. Every day without a sync is a day permanently lost.
#
# This runs the same syncStatic/syncSquad functions the route handlers call,
# so the two cannot drift.

on:
  schedule:
    # 02:00 UTC, which is AFTER the 01:30 UK price change in both BST and GMT.
    #
    # This used to be 00:15 UTC on the belief that it ran after the change. It
    # did not: GitHub cron is UTC with no timezone support, so 00:15 UTC is
    # 01:15 local under BST and 00:15 local under GMT — 15 and 75 minutes
    # EARLY respectively. Every price snapshot was therefore a day stale.
    #
    # 01:30 UK is 00:30 UTC in summer and 01:30 UTC in winter, so the only
    # times that are safely late year-round are 02:00 UTC or later.
    - cron: "0 2 * * *"
    # 06:00 UK, for the squad.
    - cron: "0 6 * * *"
    # 08:00 UK, for played-gameweek results. Late enough that bonus points have
    # been confirmed and the API has set data_checked; the job skips anything
    # still provisional, so an early run is wasted rather than wrong.
    - cron: "0 8 * * *"
  # Lets you trigger a sync by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      target:
        description: Which sync to run
        required: false
        default: all
        type: choice
        options: [all, static, squad, results, history, journal]

concurrency:
  # Two overlapping syncs would race on the same upsert. Queue, do not cancel:
  # a cancelled sync is a lost day of price history.
  group: fpl-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Both cron entries trigger this same job, so the schedule that fired is
      # what selects the target. Without this the 06:00 run would redo the
      # reference sync as well — harmless, since everything is idempotent, but
      # it would make the logs lie about what each schedule is for.
      - name: Choose target
        id: target
        run: |
          if [ -n "${{ inputs.target }}" ]; then
            echo "value=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "value=squad" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 * * *" ]; then
            echo "value=results" >> "$GITHUB_OUTPUT"
          else
            echo "value=static" >> "$GITHUB_OUTPUT"
          fi

      - name: Run sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: npm run sync -- ${{ steps.target.outputs.value }}
